name: go

on:
  push:
    branches: [main, "feat/**", "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARY: linux-cve

jobs:
  check:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test ./... -count=1

      - name: 竞态检测
        run: go test ./... -count=1 -race

  build:
    name: 交叉编译（linux/${{ matrix.arch }}）
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/AronWang001/linux-cve/internal/buildinfo.Version=${version} \
              -X github.com/AronWang001/linux-cve/internal/buildinfo.Commit=${GITHUB_SHA} \
              -X github.com/AronWang001/linux-cve/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/${BINARY} ./cmd/linux-cve
          ls -l dist/${BINARY}

      - name: 校验版本已注入
        # arm64 二进制在 amd64 runner 上跑不起来，只在本机架构上验证。
        if: matrix.arch == 'amd64'
        run: dist/${BINARY} version

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: linux-cve-linux-${{ matrix.arch }}
          path: dist/linux-cve
          retention-days: 7

  e2e:
    name: 端到端（${{ matrix.name }}）
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            distro: debian
            source: debian-tracker
            feed_args: ""
            prepare: apt-get update -qq && apt-get install -y -qq ca-certificates
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            distro: ubuntu
            source: ubuntu-oval
            feed_args: --release noble
            prepare: apt-get update -qq && apt-get install -y -qq ca-certificates
          - name: Alpine 3.20
            image: alpine:3.20
            distro: alpine
            source: alpine-secdb
            feed_args: --release 3.20
            prepare: apk add --no-cache ca-certificates

    steps:
      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          name: linux-cve-linux-amd64
          path: dist

      - name: 在目标发行版容器内同步、扫描、断言
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
          SOURCE: ${{ matrix.source }}
          FEED_ARGS: ${{ matrix.feed_args }}
          PREPARE: ${{ matrix.prepare }}
        run: |
          chmod +x dist/linux-cve
          docker run --rm -i \
            -v "$PWD/dist:/dist:ro" \
            -e DISTRO -e SOURCE -e FEED_ARGS -e PREPARE \
            "$IMAGE" sh -s <<'SH'
          set -eu
          echo "== 准备运行时 =="
          sh -c "$PREPARE" >/dev/null 2>&1 || sh -c "$PREPARE"

          echo "== 版本 =="
          /dist/linux-cve version

          echo "== 同步情报 =="
          # 分文件的源必须显式给 release：工具不会替用户猜一个「最像的」。
          /dist/linux-cve --db /tmp/cve.db feed update "$SOURCE" $FEED_ARGS

          echo "== 情报源状态 =="
          /dist/linux-cve --db /tmp/cve.db feed status

          echo "== 扫描 =="
          set +e
          /dist/linux-cve --db /tmp/cve.db scan --json > /tmp/scan.json 2>/tmp/scan.err
          code=$?
          set -e
          echo "scan 退出码：$code"
          cat /tmp/scan.err
          case "$code" in
            0|3) ;;
            9) echo "覆盖不足（退出码 9）：该发行版的情报源没有就绪"; exit 1 ;;
            *) echo "非预期退出码 $code"; exit 1 ;;
          esac

          echo "== 自证 =="
          grep -q "\"schema_version\": 1" /tmp/scan.json
          grep -q "\"distro\": \"$DISTRO\"" /tmp/scan.json
          grep -q "\"coverage\": \"COVERED\"" /tmp/scan.json
          # 判定条数为 0 说明匹配根本没跑起来，不能当成功。
          if grep -q "\"total\": 0" /tmp/scan.json; then
            echo "没有任何判定结果，匹配链路未生效"
            exit 1
          fi
          grep -E '"(total|vulnerable|fixed|unknown)"' /tmp/scan.json | head -8

          echo "== 报告 =="
          /dist/linux-cve --db /tmp/cve.db report | head -20
          SH

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, build, e2e]
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部二进制
        uses: actions/download-artifact@v4
        with:
          pattern: linux-cve-linux-*
          path: artifacts

      - name: 打包
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for arch in amd64 arm64; do
            src="artifacts/linux-cve-linux-${arch}/linux-cve"
            test -f "$src" || { echo "缺少 ${arch} 二进制"; exit 1; }
            name="linux-cve_${version}_linux_${arch}"
            # upload-artifact 不保留可执行位，直接打包会得到一个权限为 0644
            # 的二进制，解包后 ./linux-cve 是 Permission denied。
            chmod 0755 "$src"
            tar -czvf "release/${name}.tar.gz" -C "$(dirname "$src")" linux-cve
          done
          install -m 0755 packaging/install.sh release/install.sh
          # 不带 ./ 前缀：install.sh 的校验和匹配要同时吃下 name / ./name / *name 三种写法，
          # 但发布物本身规范一点，少一个变量。
          ( cd release && sha256sum ./*.tar.gz | sed 's|  \./|  |' > SHA256SUMS && cat SHA256SUMS )

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            release/install.sh
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: docs/release-notes-v2.0.0.md
